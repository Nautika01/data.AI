name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install numpy pandas scikit-learn python-dotenv joblib pytest ruff
      - run: pip install -e .
      - run: ruff check src scripts tests
      - run: python -m pytest -q
