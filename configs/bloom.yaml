# 녹조 7일 예측 — 대회 배포 번들(생성일 '26. 9. 12.) 결합 설정
# 번들 파일 8개를 data/raw/ 에 그대로 둔다. 열 이름은 번들 README 기준.

bundle_dir: data/raw
stations_file: stations.csv      # station_id, swmn_code, asos_stn_id 등
pairs_file: eval_pairs.csv       # 채점 대상 (지점, 기준일, 정답측정일, split) — 정답 규칙은 주최 측이 적용함
submission_file: sample_submission.csv

algae:                           # 조류경보제 측정자료
  file: algae_measure.csv
  mapping:
    station_id: station_id
    chck_de: date
    iem_bgalage_cell_co: cyano_cells     # ★ 예측 대상 (cells/mL)
    iem_bgalage_microsts: cells_microcystis
    iem_bgalage_anba: cells_anabaena
    iem_bgalage_osrtria: cells_oscillatoria
    iem_bgalage_apzo: cells_aphanizomenon
    iem_wtrtp: water_temp
    iem_ph: ph
    iem_doc: do
    iem_trp: transparency
    iem_tur: turbidity
    iem_chla: chl_a
    iem_microstlr: mc_lr               # 결측 84% — 참고용
    dominant_genus: dominant_genus
  lags: [1, 2, 3]                      # 이전 측정값 (세포수·수온·클로로필)
  lag_cols: [cyano_cells, water_temp, chl_a]

weather:                         # ASOS 일자료 (stations.csv 의 asos_stn_id 로 연결)
  file: asos_daily.csv
  key: asos_stn_id
  mapping:
    stnId: asos_stn_id
    tm: date
    avgTa: temp_mean
    maxTa: temp_max
    minTa: temp_min
    sumRn: precip
    hr1MaxRn: precip_1h_max
    avgWs: wind
    maxWs: wind_max
    avgRhm: humidity
    sumSsHr: sunshine
    sumGsr: solar
    avgTca: cloud
    avgTs: ground_temp
  fillna_zero: [precip, precip_1h_max]   # 강수 없음 → NaN 으로 들어오므로 0 처리
  windows: [7, 14, 28]
  aggs:
    temp_mean: [mean]
    temp_max: [max, mean]
    temp_min: [min]
    precip: [sum, max]
    wind: [mean]
    humidity: [mean]
    sunshine: [sum]
    solar: [mean]
    cloud: [mean]
    ground_temp: [mean]
  tolerance_days: 3

dam:                             # 다목적댐 일자료 (WAMIS). 저수량 열이 없어 체류시간은 저수위·유입·방류로 설계
  file: dam_daily.csv
  key: dam_name
  mapping:
    obs_date: date
    dam_name: dam_name
    rwl: level            # 저수위 EL.m
    iqty: inflow          # 유입량 m3/s
    tdqty: outflow        # 총방류량 m3/s
    spdqty: spill         # 여수로 방류량
    itqty: intake         # 취수량
    rf: dam_rain          # 강우량 mm
  windows: [7, 14, 28]
  aggs:
    inflow: [mean, sum]
    outflow: [mean, sum]
    spill: [sum]
    intake: [mean]
    dam_rain: [sum]
    level: [mean]
  flow_cols: [inflow, outflow, spill, intake, dam_rain]   # 지점 상류 댐 전체 합산
  level_cols: [level]                                     # 대표 댐 값 + 월별 평년 편차
  # 지점별 상류 다목적댐 (조정지댐 제외 — 본댐 방류와 중복). README 에 매핑이 없어 수계 지리로 검증(2026-10-20):
  #  - 내성천(영주댐)·반변천/길안천(임하·성덕댐)은 안동~예천에서, 위천(군위댐)은 상주에서 합류 → 해평 상류
  #  - 감천(김천부항댐)은 구미 선산읍 원리에서 합류, 해평취수장은 그 하류 → 해평부터 포함
  #  - 금호강(영천·보현산댐, 자료 없음)은 강정·고령보 하류 합류 → 제외
  #  - 황강(합천댐)은 합천에서, 남강(남강댐)은 함안 대산면에서 합류, 칠서취수장은 그 하류·창녕함안보 상류 → 칠서부터 포함
  #  - 밀양강(밀양댐)은 삼랑진에서 합류 → 물금·매리부터 포함. 회남은 대청호 내 지점, 용담댐은 금강 상류
  station_dams:
    HP:   [안동, 임하, 영주, 성덕, 군위, 김천부항]
    GJGR: [안동, 임하, 영주, 성덕, 군위, 김천부항]
    CS:   [안동, 임하, 영주, 성덕, 군위, 김천부항, 합천, 남강]
    MGMR: [안동, 임하, 영주, 성덕, 군위, 김천부항, 합천, 남강, 밀양]
    DCHN: [용담, 대청]
  primary_dam: {HP: 안동, GJGR: 안동, CS: 합천, MGMR: 남강, DCHN: 대청}
  tolerance_days: 3

river:                           # WAMIS 하천 수위·유량 (scripts/fetch_wamis.py 산출물). 파일이 없으면 건너뜀
  file: data/external/wamis_daily.csv       # 프로젝트 루트 기준. long 형식(date, kind, station, value)
  # station_id → {wl: 수위 관측소} (configs/wamis_stations.yaml 의 name).
  # 유량(fw)은 WAMIS 일유량 API 가 당해 연도(2026)만 반환해 학습 구간이 없으므로 결합에서 제외 (2026-10-23 확인).
  station_map:
    HP:   {wl: 구미보하}
    GJGR: {wl: 강정고령보하}
    CS:   {wl: 창녕함안보상}
    MGMR: {wl: 삼랑진교}
    # DCHN(회남)은 대청호 내 지점 → 기존 댐 자료만 사용
  zero_as_missing: [칠곡보상]                # 수위 0 값은 기록 오류 → 결측 처리
  windows: [7, 28]                          # r_flow_mean7d/28d, r_stage_mean7d/28d + log_flow_mean7d, flow_rel28d, stage_diff7d
  tolerance_days: 3

target:                          # pairs_file 이 있으면 그 규칙을 그대로 사용. 없을 때만 아래 규칙으로 계산
  horizon_days: 7
  tolerance_days: 3

split:
  train_max_year: 2024
  valid_year: 2025

output: bloom
